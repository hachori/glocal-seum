<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2e9">
  <meta name="description" content="대전자운초·대덕초·대전전민초의 2학기 교과 융합 프로젝트 수업사례집">
  <title>수업사례집 책장 · 글로컬 세움</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/app-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/app-192.png">
  <link rel="stylesheet" href="./shelf.css?v=2026-11-24-03">
  <script src="./shelf.js?v=2026-11-24-03" defer></script>
</head>
<body>
  <main class="library">
    <header class="library-header">
      <img class="brand" src="./ebooks/assets/431071dfea170cb2bbfefeca.png" alt="글로컬 세움">
      <h1>수업사례집 책장</h1>
      <p>교과 융합 프로젝트 <span aria-hidden="true">·</span> 2학기 1~6학년</p>
    </header>

    <section class="bookcase" aria-label="학교별 수업사례집">
      <ul class="books">
        <li>
          <a class="book" href="./ebooks/jawoon.html">
            <span class="book-cover"><img src="./ebooks/covers/jawoon.webp" alt="" width="520" height="735"></span>
            <span class="book-name">대전자운초</span>
          </a>
        </li>
        <li>
          <a class="book" href="./ebooks/daedeok.html">
            <span class="book-cover"><img src="./ebooks/covers/daedeok.webp" alt="" width="520" height="735"></span>
            <span class="book-name">대덕초</span>
          </a>
        </li>
        <li>
          <a class="book" href="./ebooks/jeonmin.html">
            <span class="book-cover"><img src="./ebooks/covers/jeonmin.webp" alt="" width="520" height="735"></span>
            <span class="book-name">대전전민초</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="offline" id="offline-settings" aria-labelledby="offline-title" hidden>
      <div class="offline-row">
        <div class="offline-copy">
          <h2 id="offline-title">오프라인으로 읽기</h2>
          <p id="offline-status" role="status">저장 기능을 확인하는 중입니다.</p>
        </div>
        <button id="offline-save" type="button" disabled>오프라인 저장</button>
      </div>
      <progress id="offline-progress" aria-label="수업사례집 저장 진행률" hidden></progress>
      <details id="install-help">
        <summary>태블릿 홈 화면에 추가하는 방법</summary>
        <p><strong>iPad</strong> Safari의 공유 메뉴에서 <b>홈 화면에 추가</b>를 누르세요. <b>웹 앱으로 열기</b>가 보이면 켜 주세요.</p>
        <p><strong>Android</strong> Chrome 메뉴에서 <b>설치 및 바로가기 만들기</b> 또는 <b>홈 화면에 추가</b>를 누른 뒤 <b>설치</b>를 선택하세요.</p>
        <p>추가한 아이콘을 열고 상단의 <b>글로컬 세움</b> 로고를 빠르게 세 번 누른 뒤 <b>오프라인 저장</b>을 누르세요.</p>
      </details>
      <noscript><p>오프라인 저장을 이용하려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
    </section>
  </main>
</body>
</html>
